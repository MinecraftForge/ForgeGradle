import org.gradle.api.initialization.resolve.RepositoriesMode

plugins {
    id 'dev.gradleplugins.gradle-plugin-development' version '1.9.0'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'ForgeGradle'

dependencyResolutionManagement {
    // Repositories are located in build.gradle for this project
    // dev.gradleplugins.groovy-gradle-plugin is bugged and force adds repositories on the project
    // so, we can't declare the repositories in here
    repositoriesMode = RepositoriesMode.PREFER_PROJECT

    //@formatter:off
    versionCatalogs.register('libs') {
        plugin 'licenser',    'net.minecraftforge.licenser'    version '1.2.0'
        plugin 'gradleutils', 'net.minecraftforge.gradleutils' version '2.5.1'

        // Gradle API
        version 'gradle', '4.9'
        library 'groovy', 'org.codehaus.groovy', 'groovy-all' version '2.4.12'

        // Static Analysis
        library 'nulls', 'org.jetbrains', 'annotations' version '26.0.2'

        // Dependencies
        library 'diff4j',         'com.cloudbees',             'diff4j'         version '1.2'
        library 'commons-io',     'commons-io',                'commons-io'     version '2.4'
        library 'lzma',           'com.github.jponge',         'lzma-java'      version '1.3' // replaces the LZMA binary
        library 'javaxdelta',     'com.nothome',               'javaxdelta'     version '2.0.1' // GDIFF implementation for BinPatches
        library 'gson',           'com.google.code.gson',      'gson'           version '2.8.5'
        library 'guava',          'com.google.guava',          'guava'          version '26.0-jre'
        library 'fastcsv',        'de.siegmar',                'fastcsv'        version '1.0.2'
        library 'artifactural',   'net.minecraftforge',        'artifactural'   version '1.0.+'
        library 'maven-artifact', 'org.apache.maven',          'maven-artifact' version '3.6.0'
        library 'httpclient',     'org.apache.httpcomponents', 'httpclient'     version '4.3.3'
        library 'srgutils',       'net.minecraftforge',        'srgutils'       version '0.2.12'
    }
    //@formatter:on
}
